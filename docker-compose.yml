services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-4-8}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/work_from_vacation.db}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
    volumes:
      - backend_data:/data

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      # Server-side proxy target — the browser only ever calls the frontend
      # origin, which Next.js forwards to the backend service. No CORS needed.
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://backend:8000}
    depends_on:
      - backend

volumes:
  backend_data:
